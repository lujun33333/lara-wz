name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: show xcode version
        run: xcodebuild -version

      - name: install ldid
        run: brew install ldid

      - name: build
        run: |
          chmod +x scripts/build_ipa_wz.sh
          ./scripts/build_ipa_wz.sh

      - name: summary
        if: always()
        run: |
          IPA=$(find . -maxdepth 1 -name 'lara-wz-*.ipa' -print -quit)
          if [ -n "$IPA" ]; then
            echo "### lara-wz 王者只读绘制出包成功" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| 文件 | $IPA |" >> $GITHUB_STEP_SUMMARY
            echo "| 大小 | $(wc -c < "$IPA" | tr -d ' ') 字节 |" >> $GITHUB_STEP_SUMMARY
            echo "| sha256 | $(shasum -a 256 "$IPA" | awk '{print $1}') |" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 出包失败，看 build/xcodebuild-wz.log" >> $GITHUB_STEP_SUMMARY
          fi

      - name: upload artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lara-ipa
          path: |
            lara-wz-*.ipa
            lara-wz-*.json
            build/xcodebuild-wz.log

      - name: upload release ipa
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: |
            lara-wz-*.ipa
            lara-wz-*.json
            build/xcodebuild-wz.log


  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download ipa
        uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: build/

      - name: get last 12h commits
        run: |
          COMMITS=$(git log --since="12 hours ago" --pretty=format:"- %h %s (%an)")
          if [ -z "$COMMITS" ]; then
            COMMITS="no commits in the last 12 hours"
          fi

          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: write release notes
        run: |
          cat <<EOF > release_notes.txt
          lara nightly build
          
          Last 12 hours commits:
          
          ${COMMITS}
          EOF

      - name: update nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
          gh release create nightly \
            --title "Nightly" \
            --notes "initial nightly" \
            --prerelease
      
          gh release edit nightly \
            --title "Nightly" \
            --notes-file release_notes.txt \
            --prerelease
      
          gh release upload nightly build/lara-wz-*.ipa build/lara-wz-*.json --clobber
